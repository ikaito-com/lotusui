name: release

# Builds the installable docsapp (the desktop demo of the design
# language) and attaches it to the GitHub Release for the tag.
# The Release object itself is created by the human maintainer
# (`gh release create vX.Y.Z`) — CI only uploads asset files, so the
# release stays attributed solely to them. Installables are never
# committed; the repo holds sources only.
#
# Assets (stable names — the docs site links
# releases/latest/download/<asset>, so renaming breaks those links):
#   lotusui-docsapp-macos-universal.zip   (.app, arm64+amd64 lipo)
#   lotusui-docsapp-windows-amd64.zip
#   lotusui-docsapp-linux-amd64.tar.gz
# plus a .sha256 beside each.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build assets for (e.g. v0.3.6)"
        required: true

permissions:
  contents: write

env:
  # Pinned; verified against gioui.org v0.10.1 (the version both
  # go.mod files require). Bump deliberately, with a local
  # `gogio -target macos/windows` test — see CLAUDE.md on gio moves.
  GOGIO: gioui.org/cmd/gogio@v0.10.0
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  macos:
    runs-on: macos-latest
    env:
      # Without a pinned deployment target, clang stamps the binary's
      # minos with the RUNNER's macOS (26.0 the first time this shipped)
      # and the app refuses to launch anywhere older. 12.0 is the
      # oldest floor verified on real hardware; Go's own darwin support
      # is the true lower bound if it ever rises above this.
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      CGO_CFLAGS: -mmacosx-version-min=12.0
      CGO_LDFLAGS: -mmacosx-version-min=12.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: site/go.mod
      - run: go install $GOGIO
      - name: Build universal .app
        working-directory: site
        run: |
          mkdir -p build/arm64 build/amd64 build/out
          gogio -target macos -arch arm64 -appid com.ikaito.lotusui.docs -o build/arm64/lotusui-docs.app ./docsapp
          gogio -target macos -arch amd64 -appid com.ikaito.lotusui.docs -o build/amd64/lotusui-docs.app ./docsapp
          cp -R build/arm64/lotusui-docs.app build/out/lotusui-docs.app
          lipo -create \
            build/arm64/lotusui-docs.app/Contents/MacOS/lotusui-docs \
            build/amd64/lotusui-docs.app/Contents/MacOS/lotusui-docs \
            -output build/out/lotusui-docs.app/Contents/MacOS/lotusui-docs
          lipo -info build/out/lotusui-docs.app/Contents/MacOS/lotusui-docs
          # Fail if the version floor regresses — a wrong minos ships
          # an app most Macs cannot open (26.0 shipped once).
          minos=$(otool -l build/out/lotusui-docs.app/Contents/MacOS/lotusui-docs | awk '/minos/ {print $2; exit}')
          echo "minos: $minos"
          case "$minos" in 11.*|12.*) ;; *) echo "version floor regressed to $minos (want 12.x)"; exit 1;; esac
          # ditto preserves bundle structure and extended attributes.
          ditto -c -k --keepParent build/out/lotusui-docs.app lotusui-docsapp-macos-universal.zip
          shasum -a 256 lotusui-docsapp-macos-universal.zip > lotusui-docsapp-macos-universal.zip.sha256
      - name: Upload assets
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" lotusui-docsapp-macos-universal.zip lotusui-docsapp-macos-universal.zip.sha256 --clobber

  linux-windows:
    # Pinned to the OLDEST maintained runner image, not -latest: the
    # Linux binary links the build host's glibc, so the image's age IS
    # the compatibility floor (24.04 = glibc 2.39). The Windows exe is
    # a pure-Go cross-compile and does not care which image builds it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: site/go.mod
      - name: Gio Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libwayland-dev libx11-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev \
            libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev
      - run: go install $GOGIO
      - name: Build Linux binary
        working-directory: site
        run: |
          CGO_ENABLED=1 go build -ldflags="-s -w" -o lotusui-docs ./docsapp
          tar -czf lotusui-docsapp-linux-amd64.tar.gz lotusui-docs
          sha256sum lotusui-docsapp-linux-amd64.tar.gz > lotusui-docsapp-linux-amd64.tar.gz.sha256
      - name: Build Windows exe (pure-Go cross-compile)
        working-directory: site
        run: |
          gogio -target windows -arch amd64 -appid com.ikaito.lotusui.docs -o lotusui-docs.exe ./docsapp
          zip lotusui-docsapp-windows-amd64.zip lotusui-docs.exe
          sha256sum lotusui-docsapp-windows-amd64.zip > lotusui-docsapp-windows-amd64.zip.sha256
      - name: Upload assets
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            lotusui-docsapp-linux-amd64.tar.gz lotusui-docsapp-linux-amd64.tar.gz.sha256 \
            lotusui-docsapp-windows-amd64.zip lotusui-docsapp-windows-amd64.zip.sha256 --clobber
