name: site

# Builds the docsapp WASM site and deploys to GitHub Pages.
# Built WASM bundles are never committed — the repo holds sources only.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: site/go.mod
      - run: make -C site build
      # Archived doc versions: build each tagged release into /vX.Y.Z/
      # when that tag still knew `make -C site build` (docsapp or legacy).
      - name: Build archived versions
        run: |
          python3 - <<'PY'
          import json, subprocess, os, shutil
          for v in json.load(open('site/versions.json')):
              if v['path'] == '/':
                  continue
              tag, sub = v['version'], v['path'].strip('/')
              wt = f'/tmp/lotusui-{tag}'
              subprocess.run(['git', 'worktree', 'add', '--detach', wt, tag], check=True)
              # Prefer docsapp build; fall back to whatever the tag provides.
              r = subprocess.run(['make', '-C', f'{wt}/site', 'build'])
              if r.returncode != 0:
                  print(f'skip archive {tag}: make build failed')
                  continue
              os.makedirs(f'site/dist/{sub}', exist_ok=True)
              subprocess.run(['cp', '-R', f'{wt}/site/dist/.', f'site/dist/{sub}/'], check=True)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
